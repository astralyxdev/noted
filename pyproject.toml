[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noted"
version = "0.2.0"
description = "Таск-менеджер для агентов: FastAPI-ядро, MCP-адаптер, веб-дэшборд"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "mcp>=2.0,<3",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
noted-api = "main:main"
noted-mcp = "mcp_adapter.server:main"

[tool.setuptools]
packages = ["api", "api.models", "api.routes", "api.services", "api.utils", "mcp_adapter"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
