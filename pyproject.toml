[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noted"
version = "0.7.0"
description = "A task manager for agents: a FastAPI core, MCP, and a web dashboard"
requires-python = ">=3.11"
dependencies = [
    # anyio and starlette arrive with fastapi, but they are imported by name in
    # api/utils and main.py, so they are declared rather than relied upon.
    "anyio>=4.0",
    "starlette>=0.37",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "mcp>=2.0,<3",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# SQLite needs nothing. PostgreSQL is opt-in, like the setting that selects it.
postgres = ["psycopg[binary,pool]>=3.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "psycopg[binary,pool]>=3.2"]

[project.scripts]
noted-api = "main:main"

[tool.setuptools]
packages = ["api", "api.models", "api.routes", "api.services", "api.utils"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
